name: no token logs

on:
  pull_request:
    paths:
      - 'web/**/*.ts'
      - 'web/**/*.tsx'
      - 'web/**/*.js'
      - 'web/**/*.mjs'
      - 'agent/**/*.py'
      - 'scripts/check-no-token-logs.mjs'
      - '.github/workflows/no-token-logs.yml'
  push:
    branches: [main, dev]
    paths:
      - 'web/**/*.ts'
      - 'web/**/*.tsx'
      - 'web/**/*.js'
      - 'web/**/*.mjs'
      - 'agent/**/*.py'
      - 'scripts/check-no-token-logs.mjs'

concurrency:
  group: no-token-logs-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: these jobs only read the repo.
permissions:
  contents: read

jobs:
  scan:
    name: scan for logged tokens
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: self-test the scanner
        run: node scripts/check-no-token-logs.mjs --test

      - name: scan repo for token logging
        run: node scripts/check-no-token-logs.mjs
